name: RK3568 H264 encoder compile laboratory
on:
  pull_request:
    paths:
      - 'experiments/rk3568-encoder/**'
      - '.github/workflows/encoder-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rk3568-encoder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install build tools on ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential bc bison flex libssl-dev libelf-dev pkg-config libcairo2-dev libudev-dev rsync
      - name: Compile encoder objects and matching client without executing either
        run: bash experiments/rk3568-encoder/compile.sh "$RUNNER_TEMP/encoder-work" "$RUNNER_TEMP/encoder-report"
      - name: Publish diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encoder-compile-report
          path: ${{ runner.temp }}/encoder-report
          if-no-files-found: warn
          retention-days: 14
