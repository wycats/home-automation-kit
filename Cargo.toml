[package]
name = "home-automation-kit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Typed observations and read-only diagnostics for home automation"
repository = "https://github.com/wycats/home-automation-kit"
publish = false
default-run = "home-automation-kit"
exclude = ["experiments/rk3568-kernel/**", "experiments/rk3568-diagnostic/**", "experiments/rk3568-encoder/**"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
